name: Kit checks

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

jobs:
  integrity:
    name: Kit integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.32"
          python-version: "3.12"
          enable-cache: false
      - name: Check package
        run: python3 tools/check-kit.py
      - name: Check evidence
        run: uv run tools/check-evidence.py templates/shipping-evidence.example.json
